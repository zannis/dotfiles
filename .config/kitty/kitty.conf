font_family      Iosevka Nerd Font Mono Medium
font_size        14
bold_font        Iosevka Nerd Font Mono Bold
italic_font      auto
bold_italic_font auto

hide_window_decorations titlebar-only
scrollback_lines 20000

macos_quit_when_last_window_closed yes
macos_thicken_font 0.25

map cmd+k clear_terminal to_cursor active

shell_integration no-sudo
enabled_layouts grid,splits,vertical

kitty_mod opt+shift

# BEGIN_KITTY_THEME
# Leaf Dark
include current-theme.conf
# END_KITTY_THEME

# map ctrl f to search
map cmd+f launch --type=overlay --stdin-source=@screen_scrollback /opt/homebrew/bin/fzf --no-sort --no-mouse --exact -i --tac

copy_on_select yes
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Strip trailing spaces when copying
strip_trailing_spaces smart

# Select with the mouse like in standard terminals
mouse_map left click ungrabbed mouse_selection normal

# ─────────────────────────────────────────────────────────────────────────────
# JetBrains-style Cmd shortcuts for Neovim.
# Each Cmd combo sends the same bytes as its Ctrl/Alt twin, so nvim sees
# <C-b>/<A-o>/etc. and fires the JB keymap defined in lua/config/keymaps.lua.
# ─────────────────────────────────────────────────────────────────────────────

# Navigation
map cmd+b         send_text all \x02                 # → <C-b> Go to definition
map cmd+e         send_text all \x05                 # → <C-e> Recent files
map cmd+shift+o   send_text all \x1bo                # → <A-o> Find file
map cmd+shift+a   send_text all \x1ba                # → <A-a> Find action
map cmd+shift+f   send_text all \x1bF                # → <A-S-f> Find in path
# cmd+1 removed — use <space>e in nvim to toggle the Snacks explorer

# Editing
map cmd+slash     send_text all \x1f                 # → <C-_> Toggle comment
map cmd+d         send_text all \x04                 # → <C-d> Duplicate line
map cmd+alt+l     send_text all \x1bl                # → <A-l> Reformat

# Quick actions
map alt+enter     send_text all \x1b\r               # → <A-CR> Code action
map cmd+p         send_text all \x1bp                # → <A-p> Parameter info
